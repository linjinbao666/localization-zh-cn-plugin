blurb="master" \u4E00\u8BCD\u6B63\u88AB\u5F03\u7528\uFF0C\u4E0D\u518D\u7528\u4E8E\u6307\u4EE3 Jenkins \u4E3B\u8FDB\u7A0B\u548C\u5185\u7F6E\u8282\u70B9\u3002\
  \u4E3B\u8FDB\u7A0B\u73B0\u5728\u79F0\u4E3A "controller"\uFF08\u63A7\u5236\u5668\uFF09\uFF0C\u5185\u7F6E\u8282\u70B9\u79F0\u4E3A "built-in node"\uFF08\u5185\u7F6E\u8282\u70B9\uFF09\u3002\
  UI \u5DF2\u66F4\u65B0\u4EE5\u53CD\u6620\u8FD9\u4E9B\u66F4\u6539\u3002\
  \u4EE5\u4E0B\u529F\u80FD\u4E5F\u53D7\u5230\u5F71\u54CD\uFF1A\
  <ul>\
    <li>\u5185\u7F6E\u8282\u70B9\u7684\u9690\u5F0F\u6807\u7B7E\u4ECE <code>master</code> \u66F4\u6539\u4E3A <code>built-in</code>\u3002</li>\
    <li>\u5185\u7F6E\u8282\u70B9\u7684 <code>NODE_NAME</code> \u73AF\u5883\u53D8\u91CF\u4E5F\u4ECE <code>master</code> \u66F4\u6539\u4E3A <code>built-in</code>\u3002</li>\
  </ul>\
  \u8FD9\u4E9B\u66F4\u6539\u53EF\u80FD\u5F71\u54CD\u6784\u5EFA\u884C\u4E3A\uFF0C\u56E0\u6B64\u4E0D\u4F1A\u81EA\u52A8\u5E94\u7528\u3002\
  \u5728\u5E94\u7528\u8FD9\u4E9B\u66F4\u6539\u4E4B\u524D\uFF0C\u60A8\u5E94\u5B8C\u6210\u4EE5\u4E0B\u64CD\u4F5C\uFF1A\
  <ul>\
    <li>\u68C0\u67E5\u9879\u76EE\u914D\u7F6E\u548C\u5DE5\u5177\u5B89\u88C5\u7A0B\u5E8F\u4E2D\u4F7F\u7528 <code>master</code> \u6807\u7B7E\u7684\u6807\u7B7E\u5206\u914D\u3002\
        \u8FC1\u79FB\u540E\uFF0C\u6B64\u7C7B\u6807\u7B7E\u5206\u914D\u5C06\u4E0D\u518D\u5339\u914D\u5185\u7F6E\u8282\u70B9\u3002\
        \u9664\u4E86\u66F4\u65B0\u8FD9\u4E9B\u5206\u914D\u5916\uFF0C\u60A8\u8FD8\u53EF\u4EE5\u663E\u5F0F\u5730\u5C06 <code>master</code> \u6807\u7B7E\u6DFB\u52A0\u5230\u5185\u7F6E\u8282\u70B9\u3002\
  </li>\
    <li>\u68C0\u67E5\u6784\u5EFA\u811A\u672C\u4E2D\u5BF9 <code>NODE_NAME</code> \u73AF\u5883\u53D8\u91CF\u7684\u4F7F\u7528\u3002</li>\
  </ul> \
