paragraph1 = \u5185\u5BB9\u5B89\u5168\u7B56\u7565\uFF08CSP\uFF09\u662F\u4E00\u79CD\u5B89\u5168\u673A\u5236\uFF0C\u53EF\u4EE5\u51CF\u5C11\u6216\u6D88\u9664\u7F51\u7EDC\u5B89\u5168\u6F0F\u6D1E\uFF08\u5982\u8DE8\u7AD9\u70B9\u811A\u672C\u653B\u51FB XSS\uFF09\u7684\u5F71\u54CD\u3002
paragraph2 = \u5927\u591A\u6570\u6D41\u884C\u7684 Jenkins \u63D2\u4EF6\u90FD\u4E0E Jenkins \u9ED8\u8BA4\u89C4\u5219\u96C6\u517C\u5BB9\uFF0C\u4F46\u5F53\u524D\u5DF2\u5B89\u88C5\u7684\u6240\u6709\u5185\u5BB9\u53EF\u80FD\u4E0D\u5168\u90E8\u517C\u5BB9\u3002\u5982\u679C\u4F60\u9009\u62E9\u5F3A\u5236\u6267\u884C\u5185\u5BB9\u5B89\u5168\u7B56\u7565\u5E76\u5BFC\u81F4 Jenkins UI \u65E0\u6CD5\u6B63\u5E38\u5DE5\u4F5C\uFF0C\u53EF\u4EE5\u901A\u8FC7\u8BBE\u7F6E Java \u7CFB\u7EDF\u5C5E\u6027 <code>jenkins.security.csp.CspHeader.headerName</code> \u4E3A <code>Content-Security-Policy-Report-Only</code> \u6765\u505C\u7528\u4FDD\u62A4\u3002
paragraph3 = \u5173\u4E8E\u786E\u5B9A\u5F53\u524D\u73AF\u5883\u662F\u5426\u4E0E\u5185\u5BB9\u5B89\u5168\u7B56\u7565\u517C\u5BB9\u7684\u8D44\u6E90\uFF0C\u8BF7\u8BBF\u95EE <a href="https://www.jenkins.io/redirect/csp-compatibility" target="_blank">\u6587\u6863\u7F51\u7AD9</a>\u3002
